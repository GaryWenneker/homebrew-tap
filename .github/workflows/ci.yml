name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: brew style and audit
        run: |
          set -euo pipefail
          brew style --formula Formula/ax.rb
          brew audit --strict --online --formula Formula/ax.rb
